name: Refresh 13F Idea Engine

# Self-updating pipeline: pull the latest 13F filings, refresh prices/targets,
# rebuild the self-contained index.html, commit the outputs, and deploy to Pages.
on:
  schedule:
    - cron: "0 22 * * 1-5"      # weekdays 22:00 UTC (~after US close; ~08:00 AEST)
  workflow_dispatch: {}          # allow manual runs from the Actions tab

permissions:
  contents: write                # commit refreshed data + index.html
  pages: write                   # deploy to GitHub Pages
  id-token: write                # required by deploy-pages

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carry the daily-updated price/target cache forward between runs so the
      # historical series keeps extending. Cold start falls back to the seed
      # committed in the repo. Not committed daily (24MB of small files = churn).
      - name: Restore price/target cache
        uses: actions/cache@v4
        with:
          path: |
            data/prices
            data/targets
          key: pxcache-${{ github.run_id }}
          restore-keys: |
            pxcache-

      - name: Build ideas (SEC 13F -> diff -> price -> score)
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # optional: your name/email or URL for SEC's User-Agent
        run: python3 scripts/build.py

      - name: Enrich with analyst price targets
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # optional: your name/email or URL for SEC's User-Agent
        run: python3 scripts/targets.py
        continue-on-error: true      # best-effort; never block the deploy

      - name: Render index.html
        run: python3 scripts/render.py

      # Commit only the low-churn, meaningful outputs. The price cache (data/prices,
      # data/targets) is intentionally excluded — it lives in the Actions cache above.
      - name: Commit refreshed outputs
        run: |
          git config user.name  "13f-idea-engine bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/ideas.json data/holdings data/cusip_map.json managers.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: auto-refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # A failed scheduled run is silent: Pages keeps serving the last good build, so the
  # site looks healthy while the data ages. That is exactly how this job broke on
  # 2026-07-30 and stayed broken for 12 days. Raise a visible issue instead, and keep
  # appending to the same one so a long outage reads as one thread, not daily noise.
  alert:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Refresh is failing — the site is going stale"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          The scheduled refresh failed on $(date -u +%Y-%m-%d).

          Run log: $RUN_URL

          The live site is still up, serving the last build that succeeded — it looks
          current but the prices, returns and filer counts are frozen. Until this run
          is fixed, the page is quietly wrong rather than visibly broken.
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
